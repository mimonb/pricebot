services:
  - type: web
    name: pricebot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 180 web:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8